name: CI

# Build-check gate: verifies the app compiles on every push and PR to main.
# Cloudflare Pages still handles the actual deploy on push to main — this runs
# alongside it so a broken build shows a red ✗ on the commit/PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
